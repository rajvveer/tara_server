services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: set_a_goal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - set_a_goal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d set_a_goal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  set_a_goal_data:
